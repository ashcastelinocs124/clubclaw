# ClubClaw Configuration
# Copy this file to clubclaw.yaml and fill in your values.

org:
  name: "Agentic AI @ UIUC"
  description: "The largest student-run AI club at UIUC with 250+ members"

discord:
  token: "${DISCORD_BOT_TOKEN}"
  guild_id: "1363233232203809080"

onboarding:
  welcome_channel: "welcome"
  welcome_message: "Hey {member}, welcome to {org}! React below to pick your team."
  verification:
    enabled: true
    method: "reaction"
    role: "Member"
  roles:
    - name: "Member"
      emoji: "👋"
      description: "General club member"
    - name: "MTS"
      emoji: "⚡"
      description: "Member of Technical Staff — cross-functional team role"

channels:
  categories:
    - name: "Teams"
      channels:
        - name: "team-a"
          access: ["Team A"]
        - name: "team-b"
          access: ["Team B"]
  auto_archive:
    enabled: true
    inactive_days: 30

announcements:
  channel: "announcements"
  scheduled:
    - message: "📢 Lecture tonight at 7 PM at SCD! See you there."
      cron: "0 12 * * MON"
    - message: "🛠️ Claude Code Workshop tomorrow at 6 PM at SCD!"
      cron: "0 12 * * THU"
    - message: "📋 Exec meeting today at 3:30 PM CST! See you there."
      cron: "0 14 * * SUN"
      channel: "exec-channel"

ai:
  enabled: true
  provider: "openai"
  model: "gpt-4o-mini"
  knowledge_file: "knowledge.md"
  features: []
